<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <rect width="1200" height="700" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top bar -->
  <g transform="translate(40, 30)">
    <rect width="160" height="26" rx="13" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="14" y="17" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Admin Control Console</text>
    <text x="0" y="58" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">Inventory &amp; Audit Movement Ledger</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Transactional stock adjustments protected by row-level locks and append-only audit tracking.</text>
  </g>

  <!-- 5 KPI Cards -->
  <g transform="translate(40, 130)">
    <!-- KPI 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="84" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Tracked SKUs</text>
      <text x="16" y="60" fill="#f8fafc" font-family="monospace" font-size="26" font-weight="700">24</text>
    </g>

    <!-- KPI 2 -->
    <g transform="translate(227, 0)">
      <rect width="210" height="84" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Available Units</text>
      <text x="16" y="60" fill="#10b981" font-family="monospace" font-size="26" font-weight="700">1,420</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(455, 0)">
      <rect width="210" height="84" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Low Stock Alerts</text>
      <text x="16" y="60" fill="#f59e0b" font-family="monospace" font-size="26" font-weight="700">3</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(682, 0)">
      <rect width="210" height="84" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Out of Stock</text>
      <text x="16" y="60" fill="#f43f5e" font-family="monospace" font-size="26" font-weight="700">1</text>
    </g>

    <!-- KPI 5 -->
    <g transform="translate(910, 0)">
      <rect width="210" height="84" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Total Movements</text>
      <text x="16" y="60" fill="#818cf8" font-family="monospace" font-size="26" font-weight="700">418</text>
    </g>
  </g>

  <!-- Navigation Tabs -->
  <g transform="translate(40, 236)">
    <rect width="280" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="32" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Stock Levels</text>
    <rect x="136" y="3" width="138" height="32" rx="5" fill="#1e293b"/>
    <text x="150" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Audit Movement Ledger</text>
  </g>

  <!-- Main Table Container -->
  <g transform="translate(40, 290)">
    <rect width="1120" height="370" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Filter bar -->
    <g transform="translate(20, 16)">
      <rect width="240" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Filter: All Movement Types</text>
      <text x="1080" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end">Showing 10 of 418 immutable ledger entries</text>
    </g>

    <!-- Table Header -->
    <g transform="translate(20, 64)">
      <rect width="1080" height="34" rx="4" fill="#1e293b" fill-opacity="0.6"/>
      <text x="16" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Timestamp</text>
      <text x="180" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Product SKU</text>
      <text x="340" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Movement Type</text>
      <text x="500" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" text-anchor="end">Previous</text>
      <text x="590" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" text-anchor="middle">Delta</text>
      <text x="680" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" text-anchor="end">New Stock</text>
      <text x="740" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">Business Rationale</text>
      <text x="1064" y="22" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" text-anchor="end">Actor</text>
    </g>

    <!-- Row 1: ORDER_PURCHASE -->
    <g transform="translate(20, 114)">
      <text x="16" y="20" fill="#94a3b8" font-family="monospace" font-size="11">11/06/2026 22:45:10</text>
      <text x="180" y="20" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">SKU-EPYC-9654</text>
      <rect x="336" y="6" width="128" height="20" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="342" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">ORDER_PURCHASE</text>
      <text x="500" y="20" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">19</text>
      <rect x="566" y="6" width="48" height="20" rx="4" fill="#f43f5e" fill-opacity="0.15"/>
      <text x="590" y="20" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">-1</text>
      <text x="680" y="20" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">18</text>
      <text x="740" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Customer Checkout #ORDER-2026-8841</text>
      <text x="1064" y="20" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">User #12</text>
      <line x1="0" y1="36" x2="1080" y2="36" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 2: RESTOCK -->
    <g transform="translate(20, 164)">
      <text x="16" y="20" fill="#94a3b8" font-family="monospace" font-size="11">11/06/2026 21:12:04</text>
      <text x="180" y="20" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">SKU-SAMS-PM1743</text>
      <rect x="336" y="6" width="80" height="20" rx="4" fill="#10b981" fill-opacity="0.15"/>
      <text x="342" y="20" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">RESTOCK</text>
      <text x="500" y="20" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">25</text>
      <rect x="566" y="6" width="48" height="20" rx="4" fill="#10b981" fill-opacity="0.15"/>
      <text x="590" y="20" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">+20</text>
      <text x="680" y="20" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">45</text>
      <text x="740" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Supplier Shipment Intake (PO-99124)</text>
      <text x="1064" y="20" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="end">Admin #1</text>
      <line x1="0" y1="36" x2="1080" y2="36" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 3: MANUAL_ADJUSTMENT -->
    <g transform="translate(20, 214)">
      <text x="16" y="20" fill="#94a3b8" font-family="monospace" font-size="11">11/06/2026 19:40:55</text>
      <text x="180" y="20" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">SKU-NV-RTX6000</text>
      <rect x="336" y="6" width="138" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="342" y="20" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">MANUAL_ADJUSTMENT</text>
      <text x="500" y="20" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">4</text>
      <rect x="566" y="6" width="48" height="20" rx="4" fill="#f43f5e" fill-opacity="0.15"/>
      <text x="590" y="20" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">-2</text>
      <text x="680" y="20" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">2</text>
      <text x="740" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Damaged in transit - RMA #5541</text>
      <text x="1064" y="20" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="end">Admin #1</text>
      <line x1="0" y1="36" x2="1080" y2="36" stroke="#1e293b" stroke-width="1"/>
    </g>
  </g>
</svg>

