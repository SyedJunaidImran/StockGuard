<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Backdrop -->
  <rect width="1000" height="720" fill="url(#bgGrad)"/>
  <rect width="1000" height="720" fill="#000000" fill-opacity="0.6"/>

  <!-- Modal Container -->
  <g transform="translate(160, 40)" filter="url(#modalShadow)">
    <rect width="680" height="640" rx="16" fill="url(#modalGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Modal Header -->
    <g transform="translate(24, 24)">
      <rect width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
      <path d="M12 11 h3 l2.5 9 h10 l2.5 -6 h-13" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="23" r="1.5" fill="#38bdf8"/>
      <circle cx="26" cy="23" r="1.5" fill="#38bdf8"/>
      
      <text x="48" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">Shopping Cart</text>
      <text x="48" y="34" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">3 items in your active session</text>

      <!-- Close Button -->
      <g transform="translate(605, 4)">
        <circle cx="10" cy="10" r="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <path d="M6 6 L14 14 M14 6 L6 14" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <line x1="0" y1="76" x2="680" y2="76" stroke="#334155" stroke-width="1"/>

    <!-- Idempotency Protection Banner -->
    <g transform="translate(24, 92)">
      <rect width="632" height="48" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <path d="M16 24 C16 19 20 15 25 15 C29 15 32 17 33 21 M34 16 L34 21 L29 21 M34 24 C34 29 30 33 25 33 C21 33 18 31 17 27 M16 32 L16 27 L21 27" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="24" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Duplicate Order Protection Active</text>
      <text x="48" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Safe checkout ensures network retries or multiple clicks never duplicate your order or stock deduction.</text>
    </g>

    <!-- Cart Item 1 -->
    <g transform="translate(24, 156)">
      <rect width="632" height="80" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="12" y="12" width="56" height="56" rx="6" fill="#1e293b"/>
      <path d="M30 32 L40 24 L50 32 L50 48 L40 56 L30 48 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="80" y="32" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">SKU-EPYC-9654</text>
      <text x="80" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AMD EPYC 9654 Processor</text>
      <text x="80" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">$11,899.00 each</text>

      <!-- Stepper Controls -->
      <g transform="translate(390, 26)">
        <rect width="100" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" fill="#94a3b8" font-family="monospace" font-size="14" font-weight="700">-</text>
        <text x="48" y="18" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">1</text>
        <text x="80" y="18" fill="#94a3b8" font-family="monospace" font-size="14" font-weight="700">+</text>
      </g>

      <text x="540" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">$11,899.00</text>
      
      <!-- Delete icon -->
      <path d="M605 35 L615 45 M615 35 L605 45" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Cart Item 2 -->
    <g transform="translate(24, 246)">
      <rect width="632" height="80" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="12" y="12" width="56" height="56" rx="6" fill="#1e293b"/>
      <rect x="30" y="32" width="20" height="16" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="80" y="32" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600">SKU-SAMS-PM1743</text>
      <text x="80" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Samsung PM1743 15.36TB NVMe</text>
      <text x="80" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">$2,450.00 each</text>

      <g transform="translate(390, 26)">
        <rect width="100" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" fill="#94a3b8" font-family="monospace" font-size="14" font-weight="700">-</text>
        <text x="48" y="18" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">2</text>
        <text x="80" y="18" fill="#94a3b8" font-family="monospace" font-size="14" font-weight="700">+</text>
      </g>

      <text x="540" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">$4,900.00</text>
      <path d="M605 35 L615 45 M615 35 L605 45" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Notes field -->
    <g transform="translate(24, 340)">
      <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Order Delivery Notes (Optional):</text>
      <rect y="20" width="632" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="43" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Deliver to Data Center Bay 4B, Rack 12...</text>
    </g>

    <!-- Order Summary & Checkout Footer -->
    <g transform="translate(24, 420)">
      <rect width="632" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Subtotal (3 items)</text>
      <text x="612" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" text-anchor="end">$16,799.00</text>

      <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Estimated Freight &amp; Handling</text>
      <text x="612" y="58" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="end">Complimentary</text>

      <line x1="20" y1="78" x2="612" y2="78" stroke="#334155" stroke-width="1"/>

      <text x="20" y="106" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Estimated Total</text>
      <text x="612" y="106" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="end">$16,799.00 USD</text>

      <!-- Checkout Button -->
      <g transform="translate(20, 126)">
        <rect width="592" height="46" rx="8" fill="url(#cyanGrad)"/>
        <text x="296" y="28" fill="#020617" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Place Concurrency-Protected Order</text>
      </g>
    </g>
  </g>
</svg>

