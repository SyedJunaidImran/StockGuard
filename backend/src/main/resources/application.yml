spring:
  application:
    name: stockguard-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockguard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: StockGuardHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Application-specific properties
stockguard:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  version: 1.0.0
  jwt:
    secret: ${JWT_SECRET:stockguard_default_dev_secret_key_replace_in_production_32chars!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    email: ${STOCKGUARD_ADMIN_EMAIL:}
    password: ${STOCKGUARD_ADMIN_PASSWORD:}
    first-name: ${STOCKGUARD_ADMIN_FIRST_NAME:System}
    last-name: ${STOCKGUARD_ADMIN_LAST_NAME:Admin}
  demo:
    customer:
      email: ${STOCKGUARD_DEMO_CUSTOMER_EMAIL:customer@stockguard.io}
      password: ${STOCKGUARD_DEMO_CUSTOMER_PASSWORD:Customer123!}
      enabled: ${STOCKGUARD_DEMO_CUSTOMER_ENABLED:true}
