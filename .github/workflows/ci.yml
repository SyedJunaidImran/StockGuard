name: StockGuard CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-unit-test:
    name: Backend Unit & Slice Tests (H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x backend/mvnw

      - name: Run Unit & Slice Tests (H2)
        working-directory: backend
        run: ./mvnw -B test -Dtest="!PostgresIntegrationTest" --file pom.xml
        env:
          SPRING_PROFILES_ACTIVE: test

  postgres-integration-test:
    name: PostgreSQL 16 Integration Tests (Real Database)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockguard_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x backend/mvnw

      - name: Run Real PostgreSQL Integration Tests
        working-directory: backend
        run: ./mvnw -B test -Dtest=PostgresIntegrationTest --file pom.xml
        env:
          SPRING_PROFILES_ACTIVE: test
          STOCKGUARD_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/stockguard_test
          STOCKGUARD_TEST_POSTGRES_USER: testuser
          STOCKGUARD_TEST_POSTGRES_PASSWORD: testpassword
          STOCKGUARD_ENFORCE_POSTGRES_TESTS: "true"

  frontend-build:
    name: Frontend Build & Type Check (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check and build
        working-directory: frontend
        run: npm run build
